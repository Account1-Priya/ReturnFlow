version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: returnflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-returnflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-returnflow_secret}
      POSTGRES_DB: ${DB_NAME:-returnflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U returnflow -d returnflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: returnflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-returnflow}:${DB_PASSWORD:-returnflow_secret}@postgres:5432/${DB_NAME:-returnflow}?schema=public
      JWT_SECRET: ${JWT_SECRET:-returnflow_super_secret_jwt_key_2026}
      ENABLE_SEEDED_BUGS: ${ENABLE_SEEDED_BUGS:-false}
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: returnflow-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
