name: ReturnFlow CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend API & Service Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: returnflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client & push schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/returnflow_test?schema=public"
        run: |
          npx prisma db push --skip-generate
          npx prisma generate
          npm run seed

      - name: Run Jest test suites
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/returnflow_test?schema=public"
          JWT_SECRET: "test-super-secret-jwt-key"
          PORT: 3001
        run: npm test -- --coverage

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-coverage
          path: backend/coverage/
          retention-days: 14

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend application
        working-directory: frontend
        run: npm run build

  e2e-playwright:
    name: Playwright E2E Regression Suite
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: returnflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Backend
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/returnflow_test?schema=public"
          JWT_SECRET: "test-super-secret-jwt-key"
          PORT: 3001
        run: |
          npm ci
          npx prisma db push --skip-generate
          npx prisma generate
          npm run seed
          npm run dev &
          npx wait-on http://localhost:3001/api/docs

      - name: Setup Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run dev &
          npx wait-on http://localhost:5173

      - name: Install Playwright Browsers & Dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

